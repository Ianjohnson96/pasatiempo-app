<title>Pasatiempo Merchandise Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* "Pro shop modern": club green for the frame (the sidebar), white rounded cards on a pale green-grey page, Inter for
   everything, IBM Plex Mono only for tabular figures, brass used sparingly (highlights, "new"). Token names are kept
   from the earlier look because page code uses them inline (var(--cypress), var(--brick), var(--muted), ...). */
:root{
  --paper:#F4F6F5; --card:#FFFFFF; --sunk:#EEF2F0; --thead:#F7F9F8; --hover:#F3F6F4;
  --ink:#14201A; --muted:#5C6B63; --faint:#8A968F; --rule:#E8EDEA; --rule2:#D5DDD8; --edge:rgba(20,48,34,.07);
  --cypress:#2E7D57; --cypress-ink:#FFFFFF; --fog:#3F6F80; --ochre:#B07A18; --brick:#A33A22; --up:#1E7A4A;
  --primary:#173A2A; --primary-hi:#21503A; --primary-ink:#FFFFFF;
  --brass:#A2814A; --brass-tint:#F4EDE0;
  --tint-go:#E3F0E8; --tint-warn:#F8EEDA; --tint-stop:#FBE5DF; --tint-fog:#E2EDF1;
  --side:#173A2A; --side-hi:#21503A; --side-ink:#CFDCCF; --side-faint:rgba(207,220,207,.58); --side-line:rgba(255,255,255,.09);
  --radius:10px; --radius-sm:7px;
  --shadow-card:0 1px 2px rgba(0,0,0,.06);
  --shadow:0 18px 50px rgba(20,32,26,.18);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#7a4bc7; --c5:#c9a227; --c-ly:#A7AFA9;
  --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1412; --card:#171D1A; --sunk:#1E2622; --thead:#1A211D; --hover:#1F2824;
    --ink:#E5EBE7; --muted:#9FADA5; --faint:#76837C; --rule:#252E29; --rule2:#34403A; --edge:rgba(255,255,255,.06);
    --cypress:#5FB088; --cypress-ink:#0E1510; --fog:#6FA3B5; --ochre:#D6A64A; --brick:#E0806A; --up:#5FB088;
    --primary:#2F7A55; --primary-hi:#378A61; --primary-ink:#FFFFFF;
    --brass:#C4A36A; --brass-tint:#2C2619;
    --tint-go:#1B2B22; --tint-warn:#2E2717; --tint-stop:#33201B; --tint-fog:#1A272B;
    --side:#10261C; --side-hi:#1B3D2D; --side-ink:#C5D3C8; --side-faint:rgba(197,211,200,.5); --side-line:rgba(255,255,255,.07);
    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 18px 50px rgba(0,0,0,.55);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#9b78e0; --c5:#d1ae35; --c-ly:#58625A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1412; --card:#171D1A; --sunk:#1E2622; --thead:#1A211D; --hover:#1F2824;
  --ink:#E5EBE7; --muted:#9FADA5; --faint:#76837C; --rule:#252E29; --rule2:#34403A; --edge:rgba(255,255,255,.06);
  --cypress:#5FB088; --cypress-ink:#0E1510; --fog:#6FA3B5; --ochre:#D6A64A; --brick:#E0806A; --up:#5FB088;
  --primary:#2F7A55; --primary-hi:#378A61; --primary-ink:#FFFFFF;
  --brass:#C4A36A; --brass-tint:#2C2619;
  --tint-go:#1B2B22; --tint-warn:#2E2717; --tint-stop:#33201B; --tint-fog:#1A272B;
  --side:#10261C; --side-hi:#1B3D2D; --side-ink:#C5D3C8; --side-faint:rgba(197,211,200,.5); --side-line:rgba(255,255,255,.07);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#9b78e0; --c5:#d1ae35; --c-ly:#58625A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cypress);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.neg{color:var(--brick)}
.linklike{all:unset;cursor:pointer;border-bottom:1px dotted var(--faint)}
.linklike:hover{color:var(--cypress);border-bottom-color:var(--cypress)}
.linklike:focus-visible{outline:2px solid var(--cypress);outline-offset:2px}

/* ---------- frame: the sidebar and the main column ---------- */
.wrap{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.main{min-width:0;width:100%;max-width:1400px;padding:26px 40px 80px}
aside.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:30}
aside.side a{color:inherit;text-decoration:none}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand .seal{flex:none;width:36px;height:36px;border-radius:50%;background:#F5F0E2;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.brand .seal img{width:30px;height:30px;object-fit:contain}
.brand b{display:block;color:#fff;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:var(--side-faint);line-height:1.3;white-space:nowrap}
.sidetoggle{display:none;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--side-line);background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.sidetoggle:hover{background:rgba(255,255,255,.12)}
.side-panel{flex:1;min-height:0;display:flex;flex-direction:column}
.side-nav{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.sgroup+.sgroup{margin-top:14px}
.sglab{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--side-faint);padding:0 10px 6px}
.sitem{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:6px 10px;border-radius:7px;margin-bottom:2px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--side-ink);transition:background .12s,color .12s}
.sitem:hover{background:rgba(255,255,255,.06);color:#fff}
#sideFootNav{margin-bottom:4px}
/* Guidelines page (82-guidelines.js) */
.gd-intro{color:var(--muted);max-width:78ch;margin:0 0 14px}
.gd-tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:16px}
.gd-tabs button[role="tab"]{all:unset;cursor:pointer;padding:9px 13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.gd-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}
.gd-tabs button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.gd-tabs .gd-resetall{margin-left:auto;align-self:center}
.gd-ct{font-size:11px;background:var(--brass-tint);color:var(--ink);border-radius:9px;padding:1px 7px;margin-left:6px}
.gd-card{margin-bottom:16px}
.gd-row{display:grid;grid-template-columns:1.5fr 1.1fr .8fr 1fr 120px;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--rule)}
.gd-row.gd-role{grid-template-columns:1.5fr 1.1fr 2fr 120px}
.gd-hd{font-size:12px;color:var(--muted);padding-top:8px;padding-bottom:8px}
.gd-what b{display:block;font-weight:500}.gd-what span,.gd-sug span{display:block;color:var(--muted);font-size:12px}
.gd-sug b{font-weight:500}
.gd-now.neg{color:var(--brick)}
.gd-in{font:inherit;padding:5px 8px;border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink);width:84px}
select.gd-in{width:auto}
.abar{display:flex;height:5px;margin-top:5px;margin-left:auto;width:100%;max-width:120px;border-radius:3px;overflow:hidden;background:var(--rule2)}
.abar i{display:block;height:100%}.abar i.j{background:var(--cypress)}.abar i.s{background:var(--ochre)}
.atl{list-style:none;margin:0 0 4px;padding:0 0 0 14px;border-left:2px solid var(--rule2);font-size:13px}
.atl li{position:relative;padding:3px 0}.atl li::before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--rule2)}
.atl li.done::before{background:var(--cypress);border-color:var(--cypress)}
section.panel.attn{border-left:3px solid var(--brick)}
.viewbar .sb{margin-left:6px;background:var(--rule2);color:var(--ink);line-height:16px;font-size:10.5px}
.viewbar .sb.hot{background:#B03A22;color:#fff}
select.pick{max-width:100%;border:1px solid var(--rule2);background:var(--card);border-radius:8px;padding:5px 8px;font-size:13px}
.gd-u{color:var(--muted);font-size:12px;margin-left:4px}
.gd-row.changed .gd-in{border-color:var(--brass);background:var(--brass-tint)}
.gd-row.changed .gd-what b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-left:7px;vertical-align:middle}
.gd-row.pending .gd-what b::after{background:var(--ochre)}
.gd-wks{display:flex;gap:10px;flex-wrap:wrap}.gd-wk{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:3px}.gd-wk .gd-in{width:58px}
.gd-hist{list-style:none;margin:0;padding:0 18px 8px}.gd-hist li{padding:9px 0;border-top:1px solid var(--rule)}.gd-hist time{color:var(--muted);font-size:12.5px;margin-right:6px}
.gd-save{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-top:3px solid var(--brass);border-radius:var(--radius) var(--radius) 0 0;box-shadow:var(--shadow);padding:12px 18px;margin-top:8px;z-index:5}
.gd-save .field-inline{flex:1;min-width:220px}
.gd-mixtop{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:14px 18px 6px}
.gd-tot,.gd-ref{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.gd-tot b:first-child,.gd-ref b{color:var(--ink);font-size:14px}
#gdTotal{width:150px;font-size:16px;margin-top:4px}
.gd-lg{display:flex;gap:18px;font-size:12.5px;color:var(--muted);padding:10px 18px 0}
.gd-lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.gd-lg i.b{background:var(--brass-tint);border:1px solid var(--brass)}.gd-lg i.d{background:var(--ink);border-radius:50%}.gd-lg i.t{background:var(--cypress);width:3px}
.gd-mix{padding:4px 18px 10px}
.gd-mrow{display:grid;grid-template-columns:270px 1fr 130px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.gd-mrow .gd-what span{display:block}
.gd-pct{width:48px;padding:2px 5px}
.gd-track{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.gd-band{position:absolute;top:0;bottom:0;background:var(--brass-tint);border-left:2px solid var(--brass);border-right:2px solid var(--brass)}
.gd-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--cypress)}
.gd-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ink);border:2px solid var(--card)}
.gd-dot.out{background:var(--brick)}
.gd-verdict{font-size:12.5px}
.gd-cats{grid-column:1/-1;font-size:12.5px;color:var(--muted)}.gd-cats summary{cursor:pointer}
.gd-pv table td.pos{color:var(--up)}.gd-pv table td.neg{color:var(--brick)}.gd-pv-h td{padding-top:12px}
@media (max-width:900px){.gd-row,.gd-row.gd-role{grid-template-columns:1fr 1fr}.gd-hd{display:none}.gd-mrow{grid-template-columns:1fr}}
.sitem[aria-current="page"]{background:var(--side-hi);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--brass)}
.sitem:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.sitem .sl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;line-height:18px;min-width:20px;text-align:center;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
.sb.ok{background:#2E7D57}
.sb.hot{background:#B03A22}
.side-foot{border-top:1px solid var(--side-line);padding:10px 12px 14px;display:flex;flex-direction:column;gap:2px}
.side-link{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--side-ink)}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff}
.side-link:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.side-link svg{flex:none;opacity:.8}
.acctbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin-top:6px;border-radius:8px;cursor:pointer;color:#fff;font-weight:600;font-size:13px;background:rgba(255,255,255,.05)}
.acctbtn:hover{background:rgba(255,255,255,.1)}
.acctbtn:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.acctbtn .av{flex:none;width:30px;height:30px;border-radius:50%;background:#F5F0E2;color:#173A2A;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.acctbtn .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside.side .menu{position:relative}
aside.side .menu .pop{left:0;right:auto;top:auto;bottom:calc(100% + 6px);color:var(--ink);min-width:220px;width:max-content;max-width:280px}

/* ---------- page header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;padding-block:2px 18px}
.top .crumb{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:5px}
.top .crumb:empty{display:none}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.022em;margin:0;line-height:1.15}
.top .sub{color:var(--muted);margin-top:5px;font-size:14px;max-width:72ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- buttons, menus ---------- */
.btn{border:1px solid var(--rule2);background:var(--card);border-radius:8px;padding:7px 14px;min-height:36px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink);box-shadow:var(--shadow-card);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hi);border-color:var(--primary-hi)}
.btn.danger{color:var(--brick);border-color:color-mix(in srgb,var(--brick) 40%,var(--rule2))}
.btn.danger:hover{background:var(--tint-stop)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--cypress);box-shadow:none}
.btn.ghost:hover{background:var(--tint-go)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);min-width:230px;z-index:40;display:flex;flex-direction:column;padding:6px}
.menu .pop button{background:none;border:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
.menu .pop button:hover{background:var(--hover)}
.menu .pop a{display:block;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);text-decoration:none}
.menu .pop a:hover{background:var(--hover)}
.menu .pop hr{border:none;border-top:1px solid var(--rule);margin:6px 0}
.menu .pop form{margin:0}.menu .pop form button{width:100%}
.banner{margin-bottom:14px;padding:11px 16px;border:1px solid var(--edge);border-left:3px solid var(--ochre);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow-card);font-size:13.5px;color:var(--muted)}

/* ---------- month bar, summary, kpis ---------- */
.monthbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.months{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--edge);border-radius:10px;background:var(--card);box-shadow:var(--shadow-card)}
.months button{border:none;background:transparent;min-height:36px;padding:4px 12px;font-weight:600;font-size:13px;cursor:pointer;border-radius:7px;color:var(--muted);position:relative}
.months button:hover{background:var(--hover);color:var(--ink)}
.months button[aria-pressed="true"]{background:var(--primary);color:#fff}
.months button .now{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);line-height:1;margin-top:2px}
.months button[aria-pressed="true"] .now{color:#E9D9B8}
.monthbar .hint{font-size:12.5px;color:var(--muted)}
.summary{margin-bottom:16px;background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:16px 20px}
.summary h2{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.summary ul{margin:0;padding-left:18px}
.summary li{margin:4px 0;font-size:14px;line-height:1.55}
.summary b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:14px 16px 13px;min-width:0}
.kpi .lab{color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .x{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.4}
.kpi .meter{height:5px;background:var(--sunk);margin-top:9px;border-radius:3px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--cypress);border-radius:3px}

/* the analysis pages' two-option toggles (35-analysis.js) */
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.snav{border:1px solid var(--rule2);background:var(--card);min-height:32px;padding:0 13px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.snav:hover{color:var(--ink);background:var(--hover)}
.snav[aria-pressed="true"]{background:var(--tint-go);border-color:var(--cypress);color:var(--ink)}
.cnt{font-family:var(--mono);font-size:11.5px;background:var(--sunk);color:var(--muted);border-radius:10px;padding:1px 7px}
.cnt.hot{background:var(--tint-stop);color:var(--brick)}

/* explanations for column headings (15-tips.js) */
.tipi{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;padding:0;border-radius:50%;border:1px solid currentColor;background:none;font:600 9.5px/1 var(--ui);color:var(--faint);cursor:help;vertical-align:1px;letter-spacing:0;text-transform:none;flex:none}
th.withtip{white-space:nowrap}th.withtip>button:not(.tipi),th.withtip>span.h{display:inline-block;padding-right:0}th.withtip>span.h>.tipi,th.withtip>.tipi{margin-right:10px}
.tipi:hover,.tipi:focus-visible,.tipi[aria-expanded="true"]{color:var(--cypress)}
#tip{position:fixed;z-index:70;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none;text-transform:none;letter-spacing:0;font-family:var(--ui);font-weight:400;text-align:left;white-space:normal}
#tip b{display:block;font-weight:700;margin-bottom:2px}
#tip::after{content:"";position:absolute;left:var(--ax,50%);width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
#tip[data-side="below"]::after{top:-5px}
#tip[data-side="above"]::after{bottom:-5px}
.pane{margin-top:0}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.panel h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.panel .note{font-size:13px;color:var(--muted);padding:12px 18px 16px;line-height:1.55}
.stack{display:flex;flex-direction:column;gap:18px}

/* category rows */
/* Budget & open-to-buy: view switch, category table with a committed / room bar (30-home.js) */
.bvbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.bvbar .hint{font-size:12.5px;color:var(--muted)}
table.bcat td{vertical-align:middle}
table.bcat td.crole{color:var(--muted);font-size:12.5px}
table.bcat td.r{white-space:nowrap}
.bbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative;cursor:pointer;min-width:60px}
.bbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cypress);border-radius:4px}
.bbar i.over{background:var(--brick)}
.bbar.nobar{background:repeating-linear-gradient(135deg,var(--tint-stop) 0 6px,var(--sunk) 6px 12px)}
.bbar.wait{background:repeating-linear-gradient(135deg,var(--tint-warn) 0 6px,var(--sunk) 6px 12px)}
.bcell{width:100%;min-width:0}
.bfig{font-size:12px;margin-top:4px;white-space:nowrap}
.bfig b{font-weight:600}
.bfig span{color:var(--faint)}
/* Today (31-today.js): tiles that click through, two-column rows that stack on smaller screens */
.tgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.tile .meter{height:5px;background:var(--sunk);margin-top:9px;border-radius:3px;overflow:hidden}
.tile .meter i{display:block;height:100%;background:var(--cypress);border-radius:3px}
.tile .spk{margin-top:8px;line-height:0}
.tile[data-go]{cursor:pointer}
.tile[data-go]:hover{border-color:var(--rule2)}
.tile[data-go]:focus-visible{outline:2px solid var(--cypress);outline-offset:2px}
.duetbl td{white-space:nowrap}
.duetbl td.wrapv{white-space:normal}

/* pills and chips: one shape, a soft tint and its colour */
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:1.6;padding:0 8px;border-radius:999px;white-space:nowrap}
.chip.buy{background:var(--tint-go);color:var(--cypress)}
.chip.replenish{background:var(--tint-warn);color:var(--ochre)}
.chip.stop{background:var(--tint-stop);color:var(--brick)}
.chip.excluded{background:var(--sunk);color:var(--faint)}

/* chart */
.chart{padding:12px 14px 4px}
.axis{font-family:var(--mono);font-size:10px;fill:var(--faint)}
.axlab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 18px 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;display:inline-block;border-radius:3px}
.sw.line{height:3px;width:16px;border-radius:2px}

/* attention items */
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 16px;border-bottom:1px solid var(--rule);background:var(--card)}
.item:last-child{border-bottom:none}
.item .stripe{background:var(--rule2);border-radius:0 3px 3px 0;margin-block:12px}
.item.crit .stripe{background:var(--brick)} .item.warn .stripe{background:var(--ochre)} .item.info .stripe{background:var(--fog)} .item.good .stripe{background:var(--cypress)}
.item .body{padding:13px 0}
.item .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .who{font-family:var(--mono);font-size:11px;color:var(--faint)}
.item .d{font-size:13px;color:var(--muted);margin-top:2px}
.item .a{font-size:13px;margin-top:6px}
.item .a b{font-weight:600}
.item .side{padding:12px 16px 12px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-end;justify-content:center}
.item.resolved{opacity:.55}
.kind{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:1.6;padding:0 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
td.nowrap{white-space:nowrap}
tr.mgrp td{background:var(--sunk);padding:7px 12px;font-size:12.5px;border-top:1px solid var(--rule)}
tr.mgrp td span{color:var(--muted);margin-left:10px;font-family:var(--mono);font-size:12px}
.chkline{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 16px;border:1px solid var(--rule);border-left:4px solid var(--ochre);border-radius:10px;background:var(--card);font-size:13.5px}
.chkline.late{border-left-color:var(--brick)}
.chkline .names{flex:1;min-width:200px;color:var(--muted)}
.kind.reorder,.kind.stockout{background:var(--tint-go);color:var(--cypress)}
.kind.aged,.kind.overstock{background:var(--tint-warn);color:var(--ochre)}
.kind.margin,.kind.data,.kind.order{background:var(--tint-stop);color:var(--brick)}
.kind.split{background:var(--tint-fog);color:var(--fog)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:1px solid var(--rule);align-items:center}
.fchip{border:1px solid var(--rule2);background:var(--card);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.fchip:hover{color:var(--ink);background:var(--hover)}
.fchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.fchip .c{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-left:4px}

/* ---------- tables: quiet rules, tabular figures ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--rule)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--rule2);border-radius:8px;background:var(--card)}
.seg button{border:none;background:transparent;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:6px}
.seg button:hover{color:var(--ink);background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
#viewBar{margin-top:10px}
/* the page's verdict: one sentence, its colour saying what kind of news it is (green room/fine, amber waiting, red act) */
.verdict{margin:10px 0 0;font-size:17px;line-height:1.4;font-weight:600;color:var(--ink);padding-left:12px;border-left:4px solid var(--cypress);max-width:880px}
.verdict.watch{border-left-color:var(--ochre)}
.verdict.act{border-left-color:var(--brick);color:var(--brick)}
.tile .lab .tipi{margin-left:4px;vertical-align:1px}
/* Home: one line per phase, each opening its page */
.homelines{display:grid;gap:8px}
.homeline{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:baseline;text-align:left;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--cypress);border-radius:10px;cursor:pointer;font:inherit;color:var(--ink)}
.homeline:hover{background:var(--hover)}
.homeline.watch{border-left-color:var(--ochre)} .homeline.act{border-left-color:var(--brick)}
.homeline .hl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.homeline .ht{font-size:16px;font-weight:600;line-height:1.4}
@media (max-width:600px){.homeline{grid-template-columns:1fr;gap:2px}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field-inline{border:1px solid var(--rule2);background:var(--card);border-radius:8px;padding:6px 10px;min-height:34px;font-size:13px;min-width:0}
input.field-inline{width:220px;max-width:100%}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
.tbl table{min-width:1080px}
th{background:var(--thead);text-align:left;padding:0;border-bottom:1px solid var(--rule);white-space:nowrap}
th button,th span.h{all:unset;cursor:pointer;display:block;padding:9px 12px;font-size:11.5px;letter-spacing:.01em;color:var(--muted);font-weight:600}
th button:hover{color:var(--ink)}
th span.h{cursor:default}
th button:focus-visible{outline:2px solid var(--cypress);outline-offset:-2px}
th.r button,th.r span.h,td.r{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.r,td.num{font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom-color:transparent}
tbody.click tr{cursor:pointer}
tbody.click tr:hover td{background:var(--hover)}
tbody tr.flag-crit td:first-child{box-shadow:inset 3px 0 0 var(--brick)}
tbody tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--ochre)}
tbody tr.flag-hold td:first-child{box-shadow:inset 3px 0 0 var(--brick)}
tr.tot td{background:var(--thead);font-weight:600;border-top:1px solid var(--rule2)}
td.po{font-family:var(--mono);font-weight:600}
td .sm{display:block;font-size:11.5px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.6;padding:0 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.open{background:var(--tint-fog);color:var(--fog)}
.pill.partial{background:var(--tint-warn);color:var(--ochre)}
.pill.received{background:var(--tint-go);color:var(--cypress)}
.pill.cancelled{background:var(--sunk);color:var(--faint)}
.pill.hold{background:var(--tint-stop);color:var(--brick)}
td .sm.fixnote{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;min-width:170px;max-width:240px;white-space:normal;color:var(--brick)}
.fixbox textarea{min-height:0}
.person{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.person img{width:18px;height:18px;border-radius:50%}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:56ch;font-size:13.5px}

/* help */
.help{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.help .panel{padding:0}
.help .in{padding:16px 20px 18px;font-size:14px;line-height:1.6}
.help .in p{margin:0 0 10px;max-width:68ch}
.help h3{margin:0 0 8px;font-size:15px}
.formula{border:1px solid var(--rule);background:var(--thead);border-radius:8px;padding:12px 14px;margin:8px 0 12px;font-size:13.5px}
.formula .ln{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:4px 0}
.formula .ln span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.formula .ln.tot{border-top:1px solid var(--rule2);margin-top:4px;padding-top:8px;font-weight:600}
.formula .op{font-family:var(--mono);color:var(--muted);text-align:center}
.formula .sub{grid-column:2 / 4;font-size:12px;color:var(--muted);margin-top:-2px}
.gl{display:grid;grid-template-columns:180px 1fr;gap:8px 16px;font-size:13.5px}
.gl dt{font-weight:600}
.gl dd{margin:0;color:var(--muted)}
.routine{list-style:none;margin:0;padding:0}
.routine li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.routine li:last-child{border-bottom:none}
.routine .when{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cypress);font-weight:600;padding-top:2px}

/* ---------- drawers and dialogs (#overlay) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.4);z-index:50;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.drawer.wide{width:min(1060px,100%)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--card);z-index:51;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--rule);border-radius:14px 0 0 14px}
.drawer.narrow{width:min(560px,100%)}
.drawer>header{padding:18px 22px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.drawer .body{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .body>*{flex-shrink:0}  /* the body scrolls, not a squeezed table inside it */
.drawer>footer{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.x{background:none;border:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
button.x:hover{background:var(--hover);color:var(--ink)}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cypress);font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--rule2);background:var(--card);border-radius:8px;padding:8px 10px;font-size:14px}
.f input:focus,.f select:focus,.f textarea:focus,.field-inline:focus{outline:none;border-color:var(--cypress);box-shadow:0 0 0 3px color-mix(in srgb,var(--cypress) 18%,transparent)}
.f textarea{min-height:60px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.f.err input,.f.err select{border-color:var(--brick)}
.inline-add{border:1px dashed var(--rule2);background:var(--thead);padding:12px;display:flex;flex-direction:column;gap:10px;border-radius:8px}
.vinfo{font-size:12px;color:var(--muted);margin-top:5px}
.line{border:1px solid var(--rule);border-radius:var(--radius);background:var(--card)}
.line .lh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--thead);border-bottom:1px solid var(--rule);border-radius:var(--radius) var(--radius) 0 0}
.line .lh .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.line .lb{padding:12px;display:flex;flex-direction:column;gap:10px}
.line .lf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--rule);font-size:13px;flex-wrap:wrap}
.line .lf .ext{font-family:var(--mono);font-weight:600}
.lr{display:grid;grid-template-columns:1.1fr 1.3fr;gap:10px}
.lr3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.sizegrid{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
.sizegrid table{min-width:0;width:auto;font-size:12px}
.sizegrid th{padding:5px 4px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:600;background:var(--thead)}
.sizegrid th.rl{text-align:left;padding-left:8px;min-width:78px}
.sizegrid td{padding:3px;border-bottom:none;text-align:center}
.sizegrid td.rl{text-align:left;padding-left:8px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sizegrid td.rt{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:0 8px}
.sizegrid input{width:44px;border:1px solid var(--rule2);background:var(--card);border-radius:5px;padding:5px 3px;text-align:center;font-family:var(--mono);font-size:12.5px}
.sizegrid input:not(:placeholder-shown){background:var(--tint-go);border-color:var(--cypress)}
.ordertot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--rule2);background:var(--thead);border-radius:var(--radius);flex-wrap:wrap}
.ordertot .big{font-size:20px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.impact{border:1px solid var(--rule);background:var(--thead);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.impact .ln{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.impact .ln span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.impact .ln.b{font-weight:600}
.impact + .impact{margin-top:0}
.gauge{height:8px;background:var(--card);border-radius:4px;overflow:hidden;display:flex;margin:4px 0}
.gauge i{display:block;height:100%}
.warnbox{border-left:3px solid var(--ochre);background:var(--tint-warn);padding:9px 12px;font-size:13px;color:var(--ink);border-radius:0 8px 8px 0}
.warnbox.crit{border-left-color:var(--brick);background:var(--tint-stop)}
.warnbox.info{border-left-color:var(--fog);background:var(--tint-fog)}
.warnbox.good{border-left-color:var(--cypress);background:var(--tint-go)}
.receive{border:1px solid var(--rule);padding:12px 14px;border-radius:var(--radius)}
.receive h3{margin:0 0 8px;font-size:13.5px}
.receive .rr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--card);z-index:51;box-shadow:var(--shadow);border:1px solid var(--rule);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.modal>header{padding:18px 22px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px}
.modal .body{padding:18px 22px;overflow-y:auto}
.modal>footer{padding:14px 22px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px}
.modal textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:12px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;padding:10px}
.prev{overflow-x:auto;margin-top:12px;border:1px solid var(--rule);border-radius:8px}
.prev table{min-width:760px;font-size:12px}
.prev td,.prev th{padding:6px 8px}
.prev .bad td{background:var(--tint-stop)}
code.k{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:4px}
.mini{width:100%;font-size:12.5px}
.mini th{padding:7px 8px;font-size:11px;font-weight:600;color:var(--muted);text-align:left}
.mini td{padding:7px 8px}
.mini td.r,.mini th.r{text-align:right}
.mini input{width:100%;border:1px solid var(--rule2);background:var(--card);border-radius:5px;padding:5px 6px;font-family:var(--mono);font-size:12.5px;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:1320px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.grid,.help,.tgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:23px}.row2,.row3,.lr,.lr3{grid-template-columns:1fr}.receive .rr{grid-template-columns:1fr 1fr}input.field-inline{width:100%}.item{grid-template-columns:4px 1fr}.item .side{grid-column:2;align-items:flex-start;flex-direction:row;padding:0 0 12px}.gl{grid-template-columns:1fr}.routine li{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- program pages ---------- */
.duebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--ink)}
.duebar.late{border-left-color:var(--brick);background:var(--tint-stop)}
.rstat{font-size:11px;font-weight:600;letter-spacing:.02em;line-height:1.6;padding:0 8px;border-radius:999px;white-space:nowrap}
.rstat.upcoming{background:var(--tint-fog);color:var(--fog)}
