<title>Pasatiempo Merchandise Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --sunk:#E9EDE8; --hover:#F6F8F5;
  --ink:#16201B; --muted:#56645B; --faint:#86928A; --rule:#D5DCD5; --rule2:#C3CCC4;
  --cypress:#2E6B4F; --cypress-ink:#FFFFFF; --fog:#46707F; --ochre:#8F6A1A; --brick:#A4402C;
  --tint-go:#E1ECE4; --tint-warn:#F4EBD6; --tint-stop:#F5E2DD; --tint-fog:#DFE9EC;
  --shadow:0 18px 50px rgba(22,32,27,.18);
  --band:#1C4332; --band-soft:#BFD8C9;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c-ly:#A7AFA9; --up:#1E6B3A;
  --ui:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111512; --card:#191E1A; --sunk:#141814; --hover:#1F2520;
    --ink:#E4E9E3; --muted:#9DAAA1; --faint:#728077; --rule:#2C342E; --rule2:#3A443C;
    --cypress:#5FB088; --cypress-ink:#0E1510; --fog:#6FA3B5; --ochre:#D6A64A; --brick:#D97A63;
    --tint-go:#1D2B22; --tint-warn:#2E2717; --tint-stop:#321E19; --tint-fog:#1A262A;
    --shadow:0 18px 50px rgba(0,0,0,.5);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c-ly:#58625A; --up:#5FB088;
  }
}
:root[data-theme="dark"]{
  --paper:#111512; --card:#191E1A; --sunk:#141814; --hover:#1F2520;
  --ink:#E4E9E3; --muted:#9DAAA1; --faint:#728077; --rule:#2C342E; --rule2:#3A443C;
  --cypress:#5FB088; --cypress-ink:#0E1510; --fog:#6FA3B5; --ochre:#D6A64A; --brick:#D97A63;
  --tint-go:#1D2B22; --tint-warn:#2E2717; --tint-stop:#321E19; --tint-fog:#1A262A;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c-ly:#58625A; --up:#5FB088;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;margin:0;padding-inline:20px;padding-block:0 70px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1260px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cypress);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.neg{color:var(--brick)}

/* header */
/* the green band: back to the Club Hub, the program's name, your account. Full width, whatever the page padding. */
.band{background:var(--band);color:#fff;margin-inline:-20px;padding-inline:20px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.band-in{max-width:1260px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:64px}
.band a{color:inherit;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-weight:600;font-size:13.5px;white-space:nowrap}
.back:hover{background:rgba(255,255,255,.2)}
.back svg{flex:none}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brandmark .seal{flex:none;width:40px;height:40px;border-radius:50%;background:#F6F2E9;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.brandmark .seal img{width:34px;height:34px;object-fit:contain}
.brandmark .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--band-soft);line-height:1.2}
.brandmark .t{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acctbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 10px 0 4px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer;font-weight:600;font-size:13px}
.acctbtn:hover{background:rgba(255,255,255,.12)}
.acctbtn .av{width:32px;height:32px;border-radius:50%;background:var(--band-soft);color:var(--band);display:grid;place-items:center;font-size:12px;font-weight:700}
.band .menu .pop{color:var(--ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:22px 16px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.top .sub{color:var(--muted);margin-top:4px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--rule2);background:var(--card);border-radius:4px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--cypress);border-color:var(--cypress);color:var(--cypress-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--brick);border-color:color-mix(in srgb,var(--brick) 45%,var(--rule2))}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--cypress)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);min-width:230px;z-index:30;display:flex;flex-direction:column;padding:6px}
.menu .pop button{background:none;border:none;text-align:left;padding:8px 10px;border-radius:3px;cursor:pointer;font-size:13px}
.menu .pop button:hover{background:var(--hover)}
.menu .pop a{display:block;padding:8px 10px;border-radius:3px;font-size:13px;color:inherit;text-decoration:none}
.menu .pop a:hover{background:var(--hover)}
.menu .pop hr{border:none;border-top:1px solid var(--rule);margin:6px 0}
.menu .pop form{margin:0}.menu .pop form button{width:100%}
.banner{margin-top:4px;padding:10px 14px;border:1px solid var(--rule);border-left:4px solid var(--ochre);background:var(--card);font-size:13px;color:var(--muted)}

/* month bar */
.monthbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--rule2);padding-top:14px}
.months{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--rule2);border-radius:10px;background:var(--card)}
.months button{border:none;background:transparent;min-height:38px;padding:4px 13px;font-weight:600;font-size:13px;cursor:pointer;border-radius:7px;color:var(--muted);position:relative}
.months button:hover{background:var(--hover);color:var(--ink)}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.months button .now{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cypress);line-height:1;margin-top:2px}
.months button[aria-pressed="true"] .now{color:var(--paper);opacity:.8}
.monthbar .hint{font-size:12.5px;color:var(--muted)}
.summary{margin-top:14px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--cypress);padding:14px 18px}
.summary h2{margin:0 0 6px;font-size:16px;letter-spacing:-.01em}
.summary ul{margin:0;padding-left:18px}
.summary li{margin:3px 0;font-size:14px;line-height:1.5}
.summary b{font-weight:600}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:14px}
.kpi{background:var(--card);padding:14px 15px 13px}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .s{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi .x{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.35}
.kpi .meter{height:5px;background:var(--sunk);margin-top:8px;border-radius:3px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--cypress)}

/* tabs */
/* Five main tabs plus More. Pinned while you scroll; on a phone a 3-across grid, never a sideways scroll. */
/* Four sections in one row (a 4-column grid at every width), the section's pages as wrapping pills. Pinned while you scroll. */
.tabs{position:sticky;top:0;z-index:25;margin:4px -20px 16px;padding:8px 20px 10px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule2)}
.tabs .secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;max-width:720px}
.tabs .secs button{border:1px solid var(--rule2);background:var(--card);min-height:44px;padding:0 10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-radius:8px;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs .secs button:hover{color:var(--ink);border-color:var(--muted)}
.tabs .secs button[aria-selected="true"]{background:var(--band);border-color:var(--band);color:#fff}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.snav{border:1px solid var(--rule2);background:transparent;min-height:36px;padding:0 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.snav:hover{color:var(--ink);background:var(--hover)}
.snav[aria-pressed="true"]{background:var(--tint-go);border-color:var(--cypress);color:var(--ink)}
.tabs .dot{width:8px;height:8px;border-radius:50%;background:var(--brick);flex:none}
.tabs .cnt{font-family:var(--mono);font-size:10.5px;background:var(--sunk);color:var(--muted);border-radius:10px;padding:1px 7px}
.tabs .cnt.hot{background:var(--tint-stop);color:var(--brick)}
/* explanations for column headings (15-tips.js) */
.tipi{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;padding:0;border-radius:50%;border:1px solid currentColor;background:none;font:600 9.5px/1 var(--ui);color:var(--faint);cursor:help;vertical-align:1px;letter-spacing:0;text-transform:none;flex:none}
th.withtip{white-space:nowrap}th.withtip>button:not(.tipi),th.withtip>span.h{display:inline-block;padding-right:0}th.withtip>span.h>.tipi,th.withtip>.tipi{margin-right:10px}
.tipi:hover,.tipi:focus-visible,.tipi[aria-expanded="true"]{color:var(--cypress)}
#tip{position:fixed;z-index:70;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:6px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none;text-transform:none;letter-spacing:0;font-family:var(--ui);font-weight:400;text-align:left;white-space:normal}
#tip b{display:block;font-weight:700;margin-bottom:2px}
#tip::after{content:"";position:absolute;left:var(--ax,50%);width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
#tip[data-side="below"]::after{top:-5px}
#tip[data-side="above"]::after{bottom:-5px}
.pane{margin-top:16px}

/* panels */
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--rule)}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 16px 10px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.panel h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
.panel .note{font-size:12.5px;color:var(--muted);padding:10px 16px 14px;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:18px}

/* category rows */
.cat{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:3px 12px;padding:11px 16px;border-bottom:1px solid var(--rule);align-items:center;cursor:pointer}
.cat:hover{background:var(--hover)}
.cat:last-child{border-bottom:none}
.cat .code{font-family:var(--mono);font-size:11px;color:var(--faint)}
.cat .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat .fig{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.cat .fig b{font-weight:600}
.cat .bar{grid-column:2 / 4;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative}
.cat .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cypress);border-radius:4px}
.cat .bar i.over{background:var(--brick)}
.cat .bar.nobar{background:repeating-linear-gradient(135deg,var(--tint-stop) 0 6px,var(--sunk) 6px 12px)}
.cat .bar.wait{background:repeating-linear-gradient(135deg,var(--tint-warn) 0 6px,var(--sunk) 6px 12px)}
.cat .detail{grid-column:2 / 4;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.cat .detail .mono{font-family:var(--mono);font-size:11.5px}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;font-weight:600;white-space:nowrap}
.chip.buy{background:var(--tint-go);color:var(--cypress)}
.chip.replenish{background:var(--tint-warn);color:var(--ochre)}
.chip.stop{background:var(--tint-stop);color:var(--brick)}
.chip.excluded{background:var(--sunk);color:var(--faint)}

/* chart */
.chart{padding:12px 12px 4px}
.axis{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:var(--faint)}
.axlab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:12px 16px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;display:inline-block;border-radius:1px}
.sw.line{height:3px;width:16px}

/* attention items */
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:0 14px;border-bottom:1px solid var(--rule);background:var(--card)}
.item:last-child{border-bottom:none}
.item .stripe{background:var(--rule2)}
.item.crit .stripe{background:var(--brick)} .item.warn .stripe{background:var(--ochre)} .item.info .stripe{background:var(--fog)} .item.good .stripe{background:var(--cypress)}
.item .body{padding:12px 0 12px}
.item .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .who{font-family:var(--mono);font-size:11px;color:var(--faint)}
.item .d{font-size:13px;color:var(--muted);margin-top:2px}
.item .a{font-size:13px;margin-top:5px}
.item .a b{font-weight:600}
.item .side{padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-end;justify-content:center}
.item.resolved{opacity:.55}
.kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;font-weight:600;background:var(--sunk);color:var(--muted)}
.kind.reorder,.kind.stockout{background:var(--tint-go);color:var(--cypress)}
.kind.aged,.kind.overstock{background:var(--tint-warn);color:var(--ochre)}
.kind.margin,.kind.data,.kind.order{background:var(--tint-stop);color:var(--brick)}
.kind.split{background:var(--tint-fog);color:var(--fog)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--rule);align-items:center}
.fchip{border:1px solid var(--rule2);background:var(--card);border-radius:14px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fchip .c{font-family:var(--mono);font-size:10.5px;opacity:.75;margin-left:4px}

/* table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:4px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field-inline{border:1px solid var(--rule2);background:var(--card);border-radius:4px;padding:6px 10px;font-size:13px;min-width:0}
input.field-inline{width:220px;max-width:100%}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
.tbl table{min-width:1080px}
th{background:var(--sunk);text-align:left;padding:0;border-bottom:1px solid var(--rule);white-space:nowrap}
th button,th span.h{all:unset;cursor:pointer;display:block;padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
th span.h{cursor:default}
th button:focus-visible{outline:2px solid var(--cypress);outline-offset:-2px}
th.r button,th.r span.h,td.r{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody.click tr{cursor:pointer}
tbody.click tr:hover td{background:var(--hover)}
tbody tr.flag-crit td:first-child{box-shadow:inset 3px 0 0 var(--brick)}
tbody tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--ochre)}
tr.tot td{background:var(--sunk);font-weight:600;border-top:2px solid var(--ink)}
td.po{font-family:var(--mono);font-weight:600}
td .sm{display:block;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.open{background:var(--tint-fog);color:var(--fog)}
.pill.partial{background:var(--tint-warn);color:var(--ochre)}
.pill.received{background:var(--tint-go);color:var(--cypress)}
.pill.cancelled{background:var(--sunk);color:var(--faint)}
.person{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.person img{width:18px;height:18px;border-radius:50%}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:56ch;font-size:13.5px}

/* help */
.help{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.help .panel{padding:0}
.help .in{padding:14px 18px 16px;font-size:14px;line-height:1.6}
.help .in p{margin:0 0 10px;max-width:68ch}
.help h3{margin:0 0 8px;font-size:15px}
.formula{border:1px solid var(--rule);background:var(--sunk);padding:12px 14px;margin:8px 0 12px;font-size:13.5px}
.formula .ln{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:4px 0}
.formula .ln span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.formula .ln.tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:8px;font-weight:600}
.formula .op{font-family:var(--mono);color:var(--muted);text-align:center}
.formula .sub{grid-column:2 / 4;font-size:12px;color:var(--muted);margin-top:-2px}
.gl{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;font-size:13.5px}
.gl dt{font-weight:600}
.gl dd{margin:0;color:var(--muted)}
.routine{list-style:none;margin:0;padding:0}
.routine li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.routine li:last-child{border-bottom:none}
.routine .when{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cypress);font-weight:600;padding-top:2px}

/* drawers */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.42);z-index:40}
.drawer.wide{width:min(1060px,100%)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--card);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--rule)}
.drawer.narrow{width:min(560px,100%)}
.drawer>header{padding:16px 20px 13px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer h2{margin:0;font-size:19px;letter-spacing:-.01em}
.drawer .body{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .body>*{flex-shrink:0}  /* the body scrolls, not a squeezed table inside it */
.drawer>footer{padding:13px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.x{background:none;border:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cypress);font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:5px;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--rule2);background:var(--paper);border-radius:4px;padding:8px 10px;font-size:14px}
.f textarea{min-height:60px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.f.err input,.f.err select{border-color:var(--brick)}
.inline-add{border:1px dashed var(--rule2);background:var(--sunk);padding:12px;display:flex;flex-direction:column;gap:10px;border-radius:4px}
.vinfo{font-size:12px;color:var(--muted);margin-top:5px}
.line{border:1px solid var(--rule);border-radius:5px;background:var(--card)}
.line .lh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--rule);border-radius:5px 5px 0 0}
.line .lh .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
.line .lb{padding:12px;display:flex;flex-direction:column;gap:10px}
.line .lf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--rule);font-size:13px;flex-wrap:wrap}
.line .lf .ext{font-family:var(--mono);font-weight:600}
.lr{display:grid;grid-template-columns:1.1fr 1.3fr;gap:10px}
.lr3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.sizegrid{overflow-x:auto;border:1px solid var(--rule);border-radius:4px}
.sizegrid table{min-width:0;width:auto;font-size:12px}
.sizegrid th{padding:5px 4px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:600;background:var(--sunk)}
.sizegrid th.rl{text-align:left;padding-left:8px;min-width:78px}
.sizegrid td{padding:3px;border-bottom:none;text-align:center}
.sizegrid td.rl{text-align:left;padding-left:8px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sizegrid td.rt{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:0 8px}
.sizegrid input{width:44px;border:1px solid var(--rule2);background:var(--paper);border-radius:3px;padding:5px 3px;text-align:center;font-family:var(--mono);font-size:12.5px}
.sizegrid input:not(:placeholder-shown){background:var(--tint-go);border-color:var(--cypress)}
.ordertot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--ink);border-radius:4px;flex-wrap:wrap}
.ordertot .big{font-size:20px;font-weight:700;font-family:var(--mono)}
.impact{border:1px solid var(--rule);background:var(--sunk);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.impact .ln{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.impact .ln span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.impact .ln.b{font-weight:600}
.impact + .impact{margin-top:0}
.gauge{height:8px;background:var(--card);border-radius:4px;overflow:hidden;display:flex;margin:4px 0}
.gauge i{display:block;height:100%}
.warnbox{border-left:3px solid var(--ochre);background:var(--tint-warn);padding:8px 10px;font-size:13px;color:var(--ink)}
.warnbox.crit{border-left-color:var(--brick);background:var(--tint-stop)}
.warnbox.info{border-left-color:var(--fog);background:var(--tint-fog)}
.warnbox.good{border-left-color:var(--cypress);background:var(--tint-go)}
.receive{border:1px solid var(--rule);padding:12px 14px;border-radius:4px}
.receive h3{margin:0 0 8px;font-size:13.5px}
.receive .rr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--card);z-index:41;box-shadow:var(--shadow);border:1px solid var(--rule);display:flex;flex-direction:column}
.modal>header{padding:16px 20px 13px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px}
.modal .body{padding:16px 20px;overflow-y:auto}
.modal>footer{padding:13px 20px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px}
.modal textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:12px;border:1px solid var(--rule2);background:var(--paper);border-radius:4px;padding:10px}
.prev{overflow-x:auto;margin-top:12px;border:1px solid var(--rule)}
.prev table{min-width:760px;font-size:12px}
.prev td,.prev th{padding:6px 8px}
.prev .bad td{background:var(--tint-stop)}
code.k{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:3px}
.mini{width:100%;font-size:12.5px}
.mini th{padding:6px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left}
.mini td{padding:6px 8px}
.mini td.r,.mini th.r{text-align:right}
.mini input{width:100%;border:1px solid var(--rule2);background:var(--paper);border-radius:3px;padding:5px 6px;font-family:var(--mono);font-size:12.5px;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){.grid,.help{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.top h1{font-size:25px}.row2,.row3,.lr,.lr3{grid-template-columns:1fr}.receive .rr{grid-template-columns:1fr 1fr}input.field-inline{width:100%}.item{grid-template-columns:5px 1fr}.item .side{grid-column:2;align-items:flex-start;flex-direction:row;padding:0 0 12px}.gl{grid-template-columns:1fr}.routine li{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* program pages */
.duebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--ink)}
.duebar.late{border-left-color:var(--brick);background:var(--tint-stop)}
.rstat{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:2px;white-space:nowrap}
.rstat.upcoming{background:var(--tint-fog);color:var(--fog)}
.rstat.due{background:var(--tint-warn);color:var(--ochre)}
.rstat.overdue{background:var(--tint-stop);color:var(--brick)}
.rstat.done{background:var(--tint-go);color:var(--cypress)}
.wibar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-left-color:var(--fog);color:var(--ink)}
.months.years button{min-width:84px}
.months.years:empty{display:none}
table input.gin,input.gin{width:58px;min-width:0;display:inline-block;padding:3px 6px;border:1px solid var(--rule2);border-radius:3px;background:var(--card);text-align:right;font-size:12.5px}
.gin:disabled{background:transparent;border-color:transparent}
.pc{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:2px}
table.fc td,table.fc th{white-space:nowrap}
table.fc tfoot td,.otbgrid tfoot td{border-top:2px solid var(--rule2)}
.otbgrid td,.otbgrid th{white-space:nowrap;padding-inline:8px}
.otbgrid td.cneg{background:var(--tint-stop)}
.otbgrid td.cpos{background:var(--tint-go)}
.otbgrid tbody tr:hover td{filter:brightness(.97)}
tr.tot td{font-weight:600;border-top:1px solid var(--rule2)}
.code{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:4px}
.chip.b-grow{background:var(--tint-go);color:var(--cypress)}
.chip.b-keep{background:var(--tint-fog);color:var(--fog)}
.chip.b-watch{background:var(--sunk);color:var(--muted)}
.chip.b-reduce{background:var(--tint-warn);color:var(--ochre)}
.chip.b-drop{background:var(--tint-stop);color:var(--brick)}
.chip.b-inactive{background:var(--sunk);color:var(--faint)}
.chip.b-special{background:var(--card);color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule2)}
.ssbulk{position:sticky;top:-16px;z-index:3;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 12px;margin:0 -4px;background:var(--tint-fog);border:1px solid var(--rule2);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:13px}
.ssbulk.idle{position:static;background:none;border-style:dashed;box-shadow:none;color:var(--muted);font-size:12.5px}
.ssbulk label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.sst tr.on td{background:color-mix(in srgb,var(--tint-fog) 70%,transparent)}
.sst input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.sotag{display:inline-block;font-size:10.5px;line-height:1.5;padding:0 5px;border-radius:3px;background:var(--tint-warn);color:var(--ochre);font-weight:600;white-space:nowrap}
.brandt td{vertical-align:middle}
.checks{list-style:none;margin:0;padding:6px 16px}
.checks li{border-bottom:1px solid var(--rule);padding:9px 0}
.checks li:last-child{border-bottom:none}
.checks label{display:grid;grid-template-columns:22px 1fr;gap:8px;cursor:pointer;align-items:start}
.checks input{margin-top:3px;width:16px;height:16px;accent-color:var(--cypress)}
.checks .d{display:block;font-size:12.5px;color:var(--muted)}
.checks .who{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;color:var(--cypress);margin-top:2px}
.checks .who img{width:16px;height:16px;border-radius:50%}
/* analysis pages: headline tiles, chart cards, grades, heat cells (35-analysis.js) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 15px 13px;min-width:0}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .d{font-family:var(--mono);font-size:11.5px;margin-top:3px;color:var(--muted)}
.tile .x{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.35}
.up{color:var(--up)}.dn{color:var(--brick)}
.gr{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;margin-top:7px;max-width:100%}
.gr.good{background:var(--tint-go);color:var(--up)}.gr.near{background:var(--tint-warn);color:var(--ochre)}.gr.bad{background:var(--tint-stop);color:var(--brick)}
td.h-good{background:color-mix(in srgb,var(--tint-go) 85%,transparent)}
td.h-near{background:color-mix(in srgb,var(--tint-warn) 85%,transparent)}
td.h-bad{background:color-mix(in srgb,var(--tint-stop) 90%,transparent);color:var(--brick);font-weight:600}
.ccard{background:var(--card);border:1px solid var(--rule);padding:14px 16px 12px;min-width:0}
.ccard>h3{font-size:14.5px;margin:0;letter-spacing:-.005em}
.ccard>.cs{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.ccols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.astack{display:flex;flex-direction:column;gap:16px}
.ch{display:block;max-width:100%;height:auto;overflow:visible}
.ch .grid{stroke:var(--rule);stroke-width:1}
.ch .ax{fill:var(--faint);font:10.5px var(--mono)}
.ch .axn{fill:var(--muted);font:600 11px var(--ui)}
.ch .quad{fill:var(--faint);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ch .plab{fill:var(--muted);font:600 10.5px var(--ui);paint-order:stroke;stroke:var(--card);stroke-width:3px;pointer-events:none}
.ch .ref{stroke:var(--muted);stroke-dasharray:4 3;stroke-width:1}
.ch .k1{fill:var(--c1)}.ch .k2{fill:var(--c2)}.ch .k3{fill:var(--c3)}.ch .kly{fill:var(--c-ly)}
.ch .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .l1{stroke:var(--c1)}.ch .l2{stroke:var(--c2)}.ch .l3{stroke:var(--c3)}.ch .lly{stroke:var(--c-ly)}
.ch .dash{stroke-dasharray:5 4}
.ch .pt{fill-opacity:.8;stroke:var(--card);stroke-width:2;cursor:pointer}
.ch .pt:hover{fill-opacity:1}
.ch .dot{stroke:var(--card);stroke-width:2}
.ch .hit{fill:var(--ink);fill-opacity:0;cursor:crosshair}
.ch .hit:hover{fill-opacity:.05}
.ch.spark{display:inline-block;vertical-align:middle}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:0 0 8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.csw{width:12px;height:12px;border-radius:3px;display:inline-block}
.csw.k1{background:var(--c1)}.csw.k2{background:var(--c2)}.csw.k3{background:var(--c3)}.csw.kly{background:var(--c-ly)}
.csw.dash{height:3px;border-radius:2px}
.sug{list-style:none;margin:0;padding:0}
.sug li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 16px;border-bottom:1px solid var(--rule)}
.sug li:last-child{border-bottom:none}
.sug .t{font-weight:600;font-size:13.5px}
.sug .w{grid-column:1;font-size:12.5px;color:var(--muted)}
.sug .a{grid-column:1;font-size:12.5px;color:var(--cypress);font-weight:600}
.sug .i{grid-row:1 / 4;grid-column:2;text-align:right;font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
.sug .i small{display:block;font-family:var(--ui);font-weight:400;font-size:11px;color:var(--faint)}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:12px 16px 14px}
.health button{all:unset;cursor:pointer;border-radius:6px;padding:9px 11px;border:1px solid var(--rule);background:var(--card);display:flex;flex-direction:column;gap:2px;min-width:0}
.health button:hover{border-color:var(--rule2);background:var(--hover)}
.health button:focus-visible{outline:2px solid var(--cypress);outline-offset:2px}
.health .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.health .h-good{border-left:4px solid var(--up)}.health .h-near{border-left:4px solid var(--ochre)}.health .h-bad{border-left:4px solid var(--brick)}
.sharebar{display:grid;gap:2px;width:110px}
.sharebar i{display:block;height:6px;border-radius:3px}
.sharebar .sb-s{background:var(--c1)}.sharebar .sb-o{background:var(--c2)}
.atbl{overflow-x:auto;max-width:100%;border-top:1px solid var(--rule)}
.atbl table{min-width:760px}
.atbl td:first-child,.atbl th:first-child{position:sticky;left:0;z-index:1;background:var(--card);white-space:nowrap;min-width:200px;box-shadow:inset -1px 0 0 var(--rule)}
.atbl td{white-space:nowrap}
.atbl th:first-child{background:var(--sunk)}
.atbl tr.asub td{font-size:12.5px;background:var(--paper)}
.atbl tr.asub td:first-child{padding-left:30px;background:var(--paper)}
.atbl tr.acat td:first-child{font-weight:600}
.atbl tr.asub td.h-good{background:color-mix(in srgb,var(--tint-go) 70%,var(--paper))}.atbl tr.asub td.h-near{background:color-mix(in srgb,var(--tint-warn) 70%,var(--paper))}.atbl tr.asub td.h-bad{background:color-mix(in srgb,var(--tint-stop) 80%,var(--paper))}
.atbl tr.acat{cursor:pointer}
.atbl tr.acat:hover td{background:var(--hover)}
.atbl .caret{display:inline-block;width:14px;color:var(--faint);transition:transform .15s}
.atbl tr.open .caret{transform:rotate(90deg)}
.tview{margin-top:8px;font-size:12.5px}.tview>summary{cursor:pointer;color:var(--cypress);font-weight:600;width:max-content}.tview .atbl{margin-top:6px;border:1px solid var(--rule)}
.ch .pt:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.bench{font-size:12px;color:var(--muted);padding:10px 16px;border:1px dashed var(--rule2);background:var(--card)}
.bench b{color:var(--ink)}
/* Tables fit their card from 901px up: no forced minimum width, tighter cells, headings that may wrap. */
@media (min-width:901px){.tbl table,.atbl table,table.fc,table.brandt{min-width:0!important}td{padding:8px 9px}th button,th span.h{padding:9px 9px;white-space:normal}th,table.fc th,table.fc th span.h,table.fc th button,.brandt th,.brandt th button{white-space:normal}th.withtip{white-space:normal}.atbl td:first-child,.atbl th:first-child{min-width:170px}}
/* Small laptops: compact cells so wide tables still fit; the 24-month sparkline column steps aside. */
@media (min-width:901px) and (max-width:1199px){.tbl table,.atbl table{font-size:12px}td{padding:6px 7px}th button,th span.h{padding:7px 7px;letter-spacing:.04em}.gin,input.gin{width:50px}.atbl td:first-child,.atbl th:first-child{min-width:140px}.atbl td.sp,.atbl th.sp{display:none}}
/* Up to 900px (phones, tablets) each table row becomes a card of label/value pairs (15-tips.js labelTables). */

  table.rt td::before{content:attr(data-l);font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;flex:0 1 auto;white-space:normal;line-height:1.25}
  table.rt td:first-child,table.rt td.rt-wide{grid-column:1/-1;justify-content:flex-start;text-align:left;font-weight:600;white-space:normal!important;padding-left:0}
  table.rt td:first-child::before,table.rt td.rt-wide::before,table.rt td:not([data-l])::before{content:none}
  table.rt td:empty{display:none}
  table.rt td.num,table.rt td.r{white-space:nowrap!important}
  table.rt .sharebar{width:80px}table.rt td.sp{grid-column:1/-1}

}
/* The forecast's category table has 12 columns and three what-if boxes: cards until there is room. */

  table.fc.rt,table.fc.rt tbody,table.fc.rt tfoot{display:block}
  table.fc.rt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 14px;padding:10px 12px;border-bottom:1px solid var(--rule)}
