name: Caddie housekeeping

# Vercel Hobby runs cron once a day. The waterfall widens a tier offer on the
# minute scale, so once a day is not a schedule for it — it is a deferral. This
# pings the same endpoint often enough that the shop's own settings mean what
# they say on the page.
#
# Free: scheduled workflows on a public repository do not consume Actions
# minutes. The daily Vercel cron in vercel.json stays as a backstop — every
# sweep behind this endpoint is idempotent, so both firing changes nothing.
#
# Setup (one time, in repo Settings > Secrets and variables > Actions):
#   Variables tab:  CADDIE_CRON_URL = https://<your-domain>/api/cron/caddie
#   Secrets tab:    CRON_SECRET     = the same value set in the Vercel project

on:
  schedule:
    # Every ten minutes. The tightest useful band in the waterfall editor is
    # ten minutes, and a sweep cannot honour a window shorter than its own
    # interval.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A slow run must never overlap the next tick. The sweeps are idempotent, so an
# overlap would not corrupt anything, but queueing is cheaper than racing.
concurrency:
  group: caddie-housekeeping
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the caddie sweep
        env:
          URL: ${{ vars.CADDIE_CRON_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Set repository variable CADDIE_CRON_URL and secret CRON_SECRET (see the comment at the top of this file)."
            exit 1
          fi

          # No --location on purpose: a redirect here means the URL is wrong,
          # and curl drops the Authorization header across hosts anyway, so
          # following one would turn a config mistake into a confusing 401.
          code=$(curl --silent --show-error \
            --max-time 60 \
            --retry 2 --retry-delay 5 --retry-connrefused \
            --write-out '%{http_code}' \
            --output /tmp/sweep.json \
            --header "Authorization: Bearer $SECRET" \
            "$URL")

          echo "HTTP $code"
          cat /tmp/sweep.json 2>/dev/null || true
          echo

          # Fail loudly. A sweep that quietly stops is how escalation dies
          # without anyone noticing until a caddie misses a loop; a red run
          # emails whoever owns the repo.
          if [ "$code" != "200" ]; then
            echo "::error::Caddie sweep returned HTTP $code"
            exit 1
          fi
